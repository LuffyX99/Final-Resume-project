[project]
name = "ai-resume-matching-api"
version = "0.1.0"
description = "AI Resume Matching API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.163.2",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "openai>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "alembic>=1.13",
    "tiktoken>=0.7",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    "slowapi>=0.1.9",
    "scikit-learn>=1.4",
    "sentence-transformers>=3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "pytest-cov>=6.0",
    "bandit>=1.8",
    "locust>=2.31",
    "psutil>=5.9",
]
