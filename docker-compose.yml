services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: resume-postgres
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      default:
        aliases:
          - db

  frontend:
    image: nginx:latest
    container_name: resume-frontend
    ports:
      - "3001:80"

